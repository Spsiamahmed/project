  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg-gradient: linear-gradient(135deg, #007bff 0%, #00c6ff 100%);
    }

    body {
      font-family: 'Hind Siliguri', 'Plus Jakarta Sans', sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    /* Header Background */
    .hero-bg {
      background: var(--bg-gradient);
      border-radius: 0 0 60px 60px;
    }

    /* Glass Effect Card */
    .glass-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .project-card:hover {
      transform: translateY(-12px);
      box-shadow: 0 25px 50px -12px rgba(0, 123, 255, 0.2);
    }

    /* Custom Image Placeholder Colors */
    .img-placeholder {
      background: linear-gradient(45deg, #e2e8f0, #cbd5e1);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 180px;
      overflow: hidden;
      position: relative;
    }

    .img-placeholder i {
      font-size: 3rem;
      color: white;
      opacity: 0.5;
    }

    .status-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.5);
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: bold;
      backdrop-filter: blur(4px);
    }

    .nav-active {
      background: white !important;
      color: var(--primary) !important;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
    }
  </style>
</head>

  <script>
    const projects = [
      {
        id: 1,
        title: "রমজান ক্যালেন্ডার ২০২৬",
        desc: "সেহরি ও ইফতারের সঠিক সময়সূচী এবং লাইভ কাউন্টডাউন সহ একটি আধুনিক ক্যালেন্ডার অ্যাপ।",
        category: "islamic",
        link: "https://spsiamahmed.github.io/ramadan-calander-spsiamahmed/",
        icon: "fa-moon",
        imgColor: "linear-gradient(45deg, #1e3a8a, #3b82f6)"
      },
      {
        id: 2,
        title: "Magnific.ai PDF",
        desc: "প্রাইভেসি ফার্স্ট ইমেজ-টু-পিডিএফ কনভার্টার। ব্রাউজারে কাজ করে, কোনো ডেটা আপলোড হয় না।",
        category: "tool",
        link: "https://spsiamahmed.github.io/magnific",
        icon: "fa-file-pdf",
        imgColor: "linear-gradient(45deg, #ef4444, #f87171)"
      },
      {
        id: 3,
        title: "কটিয়াদী সরকারি স্কুল",
        desc: "স্কুলের তথ্য, রেজাল্ট এবং একাডেমিক গ্যালারি সংবলিত একটি শিক্ষা প্রতিষ্ঠান পোর্টাল।",
        category: "education",
        link: "https://spsiamahmed.github.io/katiadi-government-school",
        icon: "fa-school",
        imgColor: "linear-gradient(45deg, #059669, #34d399)"
      },
      {
        id: 4,
        title: "NLITH Digital Agency",
        desc: "ব্র্যান্ডিং, এসইও এবং প্রিমিয়াম ওয়েবসাইট তৈরির জন্য আমাদের অফিশিয়াল এজেন্সি সাইট।",
        category: "agency",
        link: "https://spsiamahmed.github.io/nlithagency/",
        icon: "fa-chart-pie",
        imgColor: "linear-gradient(45deg, #1e293b, #475569)"
      },
      {
        id: 5,
        title: "Arctic PDF Pro",
        desc: "অফলাইন পিডিএফ কম্প্রেসর এবং এডিটর টুল যা অত্যন্ত দ্রুত এবং নিরাপদ।",
        category: "tool",
        link: "https://spsiamahmed.github.io/arctic-pdf/",
        icon: "fa-snowflake",
        imgColor: "linear-gradient(45deg, #0ea5e9, #7dd3fc)"
      },
      {
        id: 6,
        title: "Smart SPTODO",
        desc: "টাস্ক ম্যানেজমেন্ট এবং ডেইলি প্রগ্রেস ট্র্যাকিং ড্যাশবোর্ড। ইউজার ফ্রেন্ডলি ইন্টারফেস।",
        category: "tool",
        link: "https://spsiamahmed.github.io/todo-spsiamahmed/",
        icon: "fa-circle-check",
        imgColor: "linear-gradient(45deg, #7c3aed, #a78bfa)"
      }
    ];

    function renderProjects(filter = "all", search = "") {
      const container = document.getElementById("projectsGrid");
      container.innerHTML = "";

      const filtered = projects.filter(p => {
        const matchesFilter = filter === "all" || p.category === filter;
        const matchesSearch = p.title.toLowerCase().includes(search.toLowerCase());
        return matchesFilter && matchesSearch;
      });

      filtered.forEach(p => {
        container.innerHTML += `
          <div class="project-card glass-card rounded-[35px] overflow-hidden flex flex-col">
            <div class="img-placeholder" style="background: ${p.imgColor}">
              <div class="status-badge">Live Beta v2.0</div>
              <i class="fa-solid ${p.icon}"></i>
            </div>
            <div class="p-8 flex-grow">
              <span class="text-[10px] font-black uppercase tracking-widest text-blue-500 bg-blue-50 px-3 py-1 rounded-full">${p.category}</span>
              <h3 class="text-xl font-bold mt-4 mb-2 text-slate-800">${p.title}</h3>
              <p class="text-slate-500 text-sm leading-relaxed">${p.desc}</p>
            </div>
            <div class="px-8 pb-8">
              <a href="${p.link}" target="_blank" class="block w-full text-center py-4 bg-blue-600 text-white rounded-2xl font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-100">
                Open Project <i class="fa-solid fa-arrow-up-right-from-square ml-1 text-[10px]"></i>
              </a>
            </div>
          </div>
        `;
      });
    }

    // Initial Render
    renderProjects();

    // Event Listeners
    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("nav-active"));
        btn.classList.add("nav-active");
        renderProjects(btn.dataset.filter, document.getElementById("searchInput").value);
      });
    });

    document.getElementById("searchInput").addEventListener("input", (e) => {
      const activeFilter = document.querySelector(".filter-btn.nav-active").dataset.filter;
      renderProjects(activeFilter, e.target.value);
    });
  </script>
